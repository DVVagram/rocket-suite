name: runner probe

# Temporary: finds out which macOS runner labels this account can actually get.
on: workflow_dispatch

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-13, macos-14, macos-latest, macos-15]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    steps:
      - name: Report the machine
        run: |
          echo "label=${{ matrix.label }}"
          uname -m
          sw_vers
